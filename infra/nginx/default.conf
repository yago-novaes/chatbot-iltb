# Nginx — reverse proxy para chatbot ILTB
# Gerado por: infra/setup-vps.sh
# Certbot preenche os blocos ssl_certificate automaticamente via:
#   certbot --nginx -d $DOMAIN

# Redireciona HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO_PLACEHOLDER;

    # Necessário para o desafio ACME do Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — proxy para a aplicação FastAPI
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name DOMINIO_PLACEHOLDER;

    # Certbot injeta estas linhas automaticamente:
    # ssl_certificate     /etc/letsencrypt/live/DOMINIO_PLACEHOLDER/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/DOMINIO_PLACEHOLDER/privkey.pem;

    # Configuração TLS segura (TLS 1.2+ apenas)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Cabeçalhos de segurança
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;

    # Logs
    access_log /var/log/nginx/iltb_access.log;
    error_log  /var/log/nginx/iltb_error.log;

    # Limite de tamanho de requisição (perguntas de texto, não uploads)
    client_max_body_size 64k;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout generoso para Groq (LLM pode levar ~3-5s)
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
    }
}
